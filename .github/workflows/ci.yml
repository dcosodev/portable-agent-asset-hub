name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Lint graph-ui
        # graph-ui lints JSX under its own config and is not covered by the
        # root ESLint run.
        run: pnpm --filter @portable-agent-asset-hub/graph-ui lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: OpenAPI drift gate
        run: pnpm s6:drift
      - name: MCP tool metadata is reproducible
        # generate-mcp-tools honors SOURCE_DATE_EPOCH, so regenerating must be
        # a no-op against the committed metadata.
        run: |
          SOURCE_DATE_EPOCH=0 node scripts/generate-mcp-tools.mjs
          git diff --exit-code packages/mcp/src/generated-tool-metadata.ts
      - name: End-to-end demo
        run: node examples/demo/demo.mjs
