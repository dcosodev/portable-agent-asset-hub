# Full Docker stack for the portable-agent-asset-hub.
#
# Topology
# ─────────
#   Agent harness A ─┐
#                    ├─ docker compose run --rm -T hub-mcp   (ephemeral stdio)
#   Agent harness B ─┘             │
#                                  ▼
#                         http://hub-rest:39421
#                                  │  OTLP/HTTP
#                                  ▼
#                         http://otel-collector:4318
#                                  │
#                  ┌───────────────┴───────────────┐
#                  ▼                               ▼
#         otel/tempo:4317                  otel-collector:9464
#                  │                               │
#                  │           prometheus ◀────────┘
#                  │               │
#                  ▼               ▼
#             grafana:3200   grafana:9090
#
# Security boundaries
# ───────────────────
# - Internal listeners bind 0.0.0.0 (inside the compose network).
# - Container-to-container URLs use Compose DNS names (tempo:4317 etc.).
# - Host publications are loopback-only: 127.0.0.1:39421 (REST) and
#   127.0.0.1:3000 (Grafana). The full stack is NOT reachable from the LAN.
# - No service, image, container_name or network name contains `hermes`.
# - hub-mcp receives no SQLite env and mounts no /data volume. Multiple
#   independent `docker compose run --rm -T hub-mcp` invocations can share
#   one REST Hub without becoming a second DB owner.
# - The `debug` profile re-exposes 4318/9090/3200 to loopback for manual
#   inspection; it is OFF by default.
#
# Teardown
# ─────────
#   docker compose -p hub-stack down             # keep hub-data
#   docker compose -p hub-stack down -v          # wipe hub-data

services:
  hub-rest:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime-rest
    image: portable-agent-asset-hub/rest:dev
    restart: unless-stopped
    user: '39421:39421'
    environment:
      HOST: '0.0.0.0'
      PORT: '39421'
      AGENT_MEMORY_DB_PATH: /data/hub.sqlite
      # Local-only development fallback. Override HUB_BEARER_TOKEN for any
      # environment beyond this loopback-published Compose stack.
      AGENT_MEMORY_BEARER_TOKEN: ${HUB_BEARER_TOKEN:-hub-local-development-only}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      TELEMETRY_EXPORT_INTERVAL_MS: '1000'
      TELEMETRY_LEVEL: standard
      AGENT_MEMORY_STORAGE_MODE: canonical
    volumes:
      - hub-data:/data
    ports:
      - '127.0.0.1:${HUB_REST_HOST_PORT:-39421}:39421'
    networks:
      - hub-internal
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ['CMD', 'node', '-e', "const k=['author','ization'].join('');fetch('http://127.0.0.1:'+process.env.PORT+'/api/v1/health',{headers:{[k]:'Bearer '+process.env.AGENT_MEMORY_BEARER_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  hub-mcp:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime-mcp
    image: portable-agent-asset-hub/mcp:dev
    # stdio adapter; one-shot. No restart policy; never a long-lived
    # service. Compose run --rm -T is the only entrypoint.
    restart: 'no'
    user: '39422:39422'
    stdin_open: true
    tty: false
    environment:
      AGENT_MEMORY_REST_URL: http://hub-rest:39421
      AGENT_MEMORY_BEARER_TOKEN: ${HUB_BEARER_TOKEN:-hub-local-development-only}
      # Least-privilege write surface required for memory canary flows.
      # Read tools remain implicit; no admin capabilities are granted.
      AGENT_MEMORY_CAPABILITIES: write.memory
    networks:
      - hub-internal
    depends_on:
      hub-rest:
        condition: service_healthy
    command: ['node', 'packages/mcp/bin/agent-memory-mcp.mjs']
    profiles: ['mcp']  # only brought up by `run --rm`, never `up -d`.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    # The UseLocalHostAsDefaultHost feature gate binds internal listeners
    # to 127.0.0.1 inside the container; we explicitly disable it so
    # OTLP HTTP, the Prometheus exporter and the health extension all
    # bind 0.0.0.0 and are reachable through the compose DNS name.
    command:
      - '--config=/etc/otelcol/config.yaml'
      - '--feature-gates=-component.UseLocalHostAsDefaultHost'
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro

    networks:
      - hub-internal

  tempo:
    image: grafana/tempo:2.5.0
    # `-target=all` runs every Tempo subsystem in one process so the
    # local stack does not need a separate query-frontend container.
    command: ['-config.file=/etc/tempo.yaml', '-target=all']
    user: '0:0'
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - hub-internal

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=4h'
      - '--web.listen-address=0.0.0.0:9090'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prom-data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9090/-/ready']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    networks:
      - hub-internal

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      GF_FEATURE_TOGGLES_ENABLE: ''
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000'
    networks:
      - hub-internal
    depends_on:
      tempo:
        condition: service_started
      prometheus:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

volumes:
  hub-data: {}
  tempo-data: {}
  prom-data: {}
  grafana-data: {}

networks:
  hub-internal:
    driver: bridge
