# Optional loopback-only host publications for manual diagnostics.
# Use together with the default file:
#   docker compose -f observability/compose.yaml \
#     -f observability/compose.debug.yaml up -d
services:
  otel-collector:
    ports:
      - '127.0.0.1:4318:4318'
      - '127.0.0.1:9464:9464'
  tempo:
    ports:
      - '127.0.0.1:3200:3200'
      - '127.0.0.1:4317:4317'
  prometheus:
    ports:
      - '127.0.0.1:9090:9090'
