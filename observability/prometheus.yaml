# Prometheus local profile for the portable-agent-asset-hub Docker stack.
#
# The single scrape target is the OpenTelemetry Collector's Prometheus
# exporter, which converts OTLP metrics to Prom format on
# `otel-collector:9464`. Compose DNS resolves to the collector container,
# so we never depend on the host bridge.
#
# Retention is constrained to 4h so the local stack stays small.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: portable-agent-asset-hub-docker

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:9464
    metrics_path: /metrics
    honor_labels: true
